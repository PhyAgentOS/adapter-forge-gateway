name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.7
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: Unit tests
        run: uv run pytest -q
      - name: Verify CLI
        run: |
          uv run python main.py --help
          expected="forge-gateway $(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(uv run python main.py --version)" = "$expected"
      - name: Import Forge packages
        run: PYTHONPATH=src uv run python -c "import forge_common, forge_msgs, forge_tool"
      - name: License and public-tree checks
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f THIRD_PARTY_NOTICES.md
          test -f OPEN_SOURCE_AUDIT.md
          ! git grep -n -E 'gitlab\.ex-ai\.cn|meta-emt|/home/|/Users/' -- ':!.github/workflows/ci.yml'

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.7
      - name: Export and audit locked runtime dependencies
        run: |
          uv export --frozen --format requirements-txt --no-dev --no-emit-project --output-file /tmp/requirements.txt
          uvx --python 3.12 pip-audit --requirement /tmp/requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan publishable text for secrets
        run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '^\.git/' > /tmp/secrets.json
          python - <<'PY'
          import json
          with open("/tmp/secrets.json", encoding="utf-8") as stream:
              findings = json.load(stream).get("results", {})
          if findings:
              raise SystemExit(f"Potential secrets detected: {findings}")
          PY

  dora-smoke:
    name: Dora 1.0.1 Gateway runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - name: Install frozen dependencies and matching CLI
        run: |
          uv sync --frozen --dev
          uv tool install dora-rs-cli==1.0.1
      - name: Run Gateway as a standalone Dora node
        run: uv run --frozen python tests/integration/run_dora_smoke.py --mode single
      - name: Run image and state chain through Gateway
        run: uv run --frozen python tests/integration/run_dora_smoke.py --mode chain
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gateway-dora-run-reports
          path: build/forge2-acceptance/
